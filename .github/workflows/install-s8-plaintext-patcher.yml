name: Install audited S8 plaintext patcher

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/install-s8-plaintext-patcher.yml

permissions:
  contents: write

concurrency:
  group: install-s8-plaintext-patcher
  cancel-in-progress: false

jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/s8-cross-step-bound-city

      - name: Reconstruct and verify plaintext patcher
        shell: pwsh
        run: |
          @'
          from __future__ import annotations

          import base64
          import hashlib
          import py_compile
          import zlib
          from pathlib import Path

          parts = [
              Path(f".github/scripts/.s8-patcher.part{index:02d}")
              for index in range(6)
          ]
          encoded = b"".join(part.read_bytes() for part in parts)
          encoded_sha = hashlib.sha256(encoded).hexdigest()
          expected_encoded_sha = "d44ff164793d444951b43a33e5aa4ca40e8cd25be07b2ad47daea4ed7cbe97e4"
          if encoded_sha != expected_encoded_sha:
              raise SystemExit(
                  f"transport hash mismatch: {encoded_sha} != {expected_encoded_sha}"
              )

          payload = base64.b64decode(encoded, validate=True)
          plaintext = zlib.decompress(payload)
          plaintext_sha = hashlib.sha256(plaintext).hexdigest()
          expected_plaintext_sha = "e6f116cdd97f16426b623d5140bc05cc5f08822f0679b6c0fdde55d651af0940"
          if plaintext_sha != expected_plaintext_sha:
              raise SystemExit(
                  f"plaintext hash mismatch: {plaintext_sha} != {expected_plaintext_sha}"
              )

          target = Path(".github/scripts/apply_s8_fix.py")
          target.write_bytes(plaintext)
          py_compile.compile(str(target), doraise=True)
          print(
              f"installed_plaintext_bytes={len(plaintext)} "
              f"sha256={plaintext_sha}"
          )
          '@ | python -
          python .github/scripts/apply_s8_fix.py selftest

      - name: Commit plaintext and remove one-shot transport
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/scripts/apply_s8_fix.py
          git rm -f -- `
            .github/scripts/.s8-patcher.part00 `
            .github/scripts/.s8-patcher.part01 `
            .github/scripts/.s8-patcher.part02 `
            .github/scripts/.s8-patcher.part03 `
            .github/scripts/.s8-patcher.part04 `
            .github/scripts/.s8-patcher.part05 `
            .github/workflows/install-s8-plaintext-patcher.yml
          git diff --cached --check
          git commit -m 'chore: install audited S8 plaintext patcher [skip ci]'
          git push origin HEAD:fix/s8-cross-step-bound-city
