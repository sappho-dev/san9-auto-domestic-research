name: Recover S8 plaintext patcher from 1549d62

on:
  push:
    branches:
      - fix/s8-cross-step-bound-city
    paths:
      - .github/workflows/recover-s8-plaintext-from-1549d62.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Disable checkout newline rewriting
        run: git config --global core.autocrlf false

      - name: Checkout repair branch with history
        uses: actions/checkout@v4
        with:
          ref: fix/s8-cross-step-bound-city
          fetch-depth: 0

      - name: Recover and verify historical plaintext
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          import py_compile
          import subprocess
          from pathlib import Path

          historical = subprocess.run(
              ["git", "show", "1549d62:.github/scripts/apply_s8_fix.py.gz.b64"],
              check=True,
              stdout=subprocess.PIPE,
          ).stdout
          encoded = b"".join(historical.split())
          compressed = base64.b64decode(encoded, validate=True)
          plaintext = gzip.decompress(compressed)

          if b"def main(" not in plaintext or b"argparse" not in plaintext:
              raise SystemExit("Historical payload did not decode to the expected complete Python patcher")

          target = Path(".github/scripts/apply_s8_fix.py")
          target.write_bytes(plaintext)
          py_compile.compile(str(target), doraise=True)
          print(f"recovered_bytes={len(plaintext)} sha256={hashlib.sha256(plaintext).hexdigest()}")
          PY

      - name: Remove damaged and transitional recovery machinery
        shell: bash
        run: |
          git rm -f --ignore-unmatch \
            .github/scripts/apply_s8_fix.py.gz.b64 \
            .github/scripts/apply_s8_fix.decoded.py \
            .github/scripts/decode_s8_patcher.py \
            .github/workflows/apply-s8-fix.yml \
            .github/workflows/decode-s8-patcher.yml
          git rm -f --ignore-unmatch .github/workflows/recover-s8-plaintext-from-1549d62.yml
          git add -- .github/scripts/apply_s8_fix.py
          git diff --cached --check

      - name: Commit recovered plaintext to repair branch only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: recover complete S8 patcher plaintext from 1549d62 [skip ci]'
          git push origin HEAD:fix/s8-cross-step-bound-city
