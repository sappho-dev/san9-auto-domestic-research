name: Decode S8 patcher for audit

on:
  push:
    branches:
      - fix/s8-cross-step-bound-city
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/s8-cross-step-bound-city

      - name: Decode patcher to reviewable source
        shell: pwsh
        run: |
          $encoded = [IO.File]::ReadAllText('.github/scripts/apply_s8_fix.py.gz.b64')
          $bytes = [Convert]::FromBase64String(($encoded -replace '\s',''))
          $input = New-Object IO.MemoryStream(,$bytes)
          $gzip = New-Object IO.Compression.GZipStream($input, [IO.Compression.CompressionMode]::Decompress)
          $output = New-Object IO.MemoryStream
          $gzip.CopyTo($output)
          $gzip.Dispose()
          $input.Dispose()
          [IO.File]::WriteAllBytes('.github/scripts/apply_s8_fix.decoded.py', $output.ToArray())
          $output.Dispose()
          python -m py_compile .github/scripts/apply_s8_fix.decoded.py

      - name: Commit decoded audit source
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/scripts/apply_s8_fix.decoded.py
          if (-not (git diff --cached --quiet)) {
            git commit -m 'chore: expose S8 patcher for audit [skip ci]'
            git push origin HEAD:fix/s8-cross-step-bound-city
          }
