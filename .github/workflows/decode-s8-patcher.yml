name: Recover S8 plaintext patcher from 1549d62

on:
  push:
    branches:
      - fix/s8-cross-step-bound-city

permissions:
  contents: write

concurrency:
  group: recover-s8-plaintext
  cancel-in-progress: false

jobs:
  recover:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/s8-cross-step-bound-city

      - name: Recover and verify plaintext from historical Git object
        shell: pwsh
        run: |
          @'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          import py_compile
          import subprocess
          from pathlib import Path

          historical = subprocess.check_output(
              [
                  "git",
                  "show",
                  "1549d62:.github/scripts/apply_s8_fix.py.gz.b64",
              ]
          )
          encoded = b"".join(historical.split())
          compressed = base64.b64decode(encoded, validate=True)
          if not compressed.startswith(b"\x1f\x8b"):
              raise SystemExit("1549d62 payload is not gzip data")

          plaintext = gzip.decompress(compressed)
          if len(plaintext) < 4096:
              raise SystemExit(f"recovered patcher is unexpectedly short: {len(plaintext)} bytes")
          if b"def main(" not in plaintext or b"argparse" not in plaintext:
              raise SystemExit("recovered patcher does not contain the expected Python entry point")

          target = Path(".github/scripts/apply_s8_fix.py")
          target.write_bytes(plaintext)
          py_compile.compile(str(target), doraise=True)

          print(f"historical_blob_bytes={len(historical)}")
          print(f"gzip_bytes={len(compressed)} gzip_sha256={hashlib.sha256(compressed).hexdigest()}")
          print(f"plaintext_bytes={len(plaintext)} plaintext_sha256={hashlib.sha256(plaintext).hexdigest()}")
          '@ | python -

      - name: Commit plaintext and remove damaged transport
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/scripts/apply_s8_fix.py
          git rm -f --ignore-unmatch -- `
            .github/scripts/apply_s8_fix.py.gz.b64 `
            .github/scripts/apply_s8_fix.decoded.py `
            .github/scripts/decode_s8_patcher.py `
            .github/workflows/decode-s8-patcher.yml
          git diff --cached --check
          git commit -m 'chore: recover S8 patcher plaintext from 1549d62 [skip ci]'
          git push origin HEAD:fix/s8-cross-step-bound-city
