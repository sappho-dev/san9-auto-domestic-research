name: Materialize S8 function-context source patch v4

on:
  push:
    branches:
      - fix/s8-cross-step-bound-city
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-s8-source-v4
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout repair branch with full baseline history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/s8-cross-step-bound-city

      - name: Enforce LF worktree before any hash or patch operation
        shell: pwsh
        run: |
          git config core.autocrlf false
          git config core.safecrlf false
          git config core.eol lf
          git reset --hard HEAD

      - name: Install pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.0'
          architecture: x64

      - name: Harden immutable-baseline materializer for Windows text semantics
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('.github/scripts/materialize_s8_function_patch_v3.py')
          text = path.read_text(encoding='utf-8')

          allow_block = '''ALLOWED_SOURCE_PATHS = {
              "build.ps1",
              "native/San9BridgeP1EasyPingM2b/include/s5_current_context.h",
              "native/San9BridgeP1EasyPingM2b/src/s5_current_context.c",
              "native/San9BridgeP1EasyPingM2b/src/controller.c",
              "native/San9BridgeP1EasyPingM2b/src/bridge_dll.c",
              "native/San9BridgeP1EasyPingM2b/src/offline_selftest.c",
              "native/San9BridgeP1EasyPingM2b/build.ps1",
              "src/San9AutoDomestic.UI/NativeControllerClient.cs",
              "tests/San9AutoDomestic.UI.StateTests/UiStateTests.cs",
          }
          '''
          core_block = allow_block + '''CORE_SOURCE_PATHS = {
              "native/San9BridgeP1EasyPingM2b/include/s5_current_context.h",
              "native/San9BridgeP1EasyPingM2b/src/s5_current_context.c",
              "native/San9BridgeP1EasyPingM2b/src/controller.c",
              "native/San9BridgeP1EasyPingM2b/src/bridge_dll.c",
              "native/San9BridgeP1EasyPingM2b/src/offline_selftest.c",
          }
          '''
          if 'CORE_SOURCE_PATHS = {' not in text:
              if allow_block not in text:
                  raise SystemExit('ALLOWED_SOURCE_PATHS block was not found')
              text = text.replace(allow_block, core_block, 1)

          decode_anchor = '''        kind, plaintext = decoded
          if not all(marker in plaintext for marker in REQUIRED_MARKERS):
          '''
          decode_replacement = '''        kind, plaintext = decoded
          plaintext = plaintext.replace(b"\\r\\n", b"\\n").replace(b"\\r", b"\\n")
          if not all(marker in plaintext for marker in REQUIRED_MARKERS):
          '''
          if decode_replacement not in text:
              if decode_anchor not in text:
                  raise SystemExit('Decoded plaintext anchor was not found')
              text = text.replace(decode_anchor, decode_replacement, 1)

          run_anchor = '''            run([sys.executable, str(script), "source"], cwd=worktree)
          run(["git", "diff", "--check"], cwd=worktree)
          '''
          run_replacement = '''            run([sys.executable, str(script), "source"], cwd=worktree)
          for relative in ALLOWED_SOURCE_PATHS:
              candidate = worktree / relative
              if candidate.is_file():
                  data = candidate.read_bytes()
                  candidate.write_bytes(data.replace(b"\\r\\n", b"\\n").replace(b"\\r", b"\\n"))
          run(["git", "diff", "--check"], cwd=worktree)
          '''
          if run_replacement not in text:
              if run_anchor not in text:
                  raise SystemExit('Source-patch execution anchor was not found')
              text = text.replace(run_anchor, run_replacement, 1)

          text = text.replace(
              '            missing = ALLOWED_SOURCE_PATHS - actual\n',
              '            missing = CORE_SOURCE_PATHS - actual\n',
              1,
          )
          path.write_text(text, encoding='utf-8', newline='\n')
          '@ | python -
          python -m py_compile .github/scripts/materialize_s8_function_patch_v3.py

      - name: Recover 1549d62 baseline and apply function-context patch
        shell: pwsh
        run: |
          python .github/scripts/materialize_s8_function_patch_v3.py
          git diff --check

      - name: Remove abandoned payload route and obsolete materializers
        shell: pwsh
        run: |
          git rm -f --ignore-unmatch -- `
            .github/scripts/apply_s8_fix.py.gz.b64 `
            .github/scripts/apply_s8_fix.decoded.py `
            .github/scripts/decode_s8_patcher.py `
            .github/scripts/materialize_s8_function_patch.py `
            .github/workflows/decode-s8-patcher.yml `
            .github/workflows/recover-s8-plaintext.yml `
            .github/workflows/apply-s8-fix.yml `
            .github/workflows/materialize-s8-source.yml `
            .github/workflows/materialize-s8-source-v2.yml `
            .github/workflows/materialize-s8-source-v3.yml

      - name: Verify plaintext, function context, LF policy, and idempotency
        shell: pwsh
        run: |
          python -m py_compile `
            .github/scripts/apply_s8_fix.baseline_1549d62.py `
            .github/scripts/materialize_s8_function_patch_v3.py
          python .github/scripts/materialize_s8_function_patch_v3.py
          git diff --check
          git apply --check --reverse --recount --whitespace=nowarn `
            .github/patches/s8-cross-step-bound-city.function-context.patch
          @'
          from pathlib import Path

          audited = [
              Path('.github/scripts/apply_s8_fix.baseline_1549d62.py'),
              Path('.github/scripts/materialize_s8_function_patch_v3.py'),
              Path('.github/patches/s8-cross-step-bound-city.function-context.patch'),
          ]
          for path in audited:
              data = path.read_bytes()
              if b'\r\n' in data or b'\r' in data:
                  raise SystemExit(f'CRLF/CR remains in audited plaintext: {path}')
          '@ | python -

      - name: Commit materialized source state
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if (-not (git diff --cached --quiet)) {
            git commit -m 'fix: materialize S8 cross-step city binding source patch'
            git push origin HEAD:fix/s8-cross-step-bound-city
          }
