name: Record latest S8 candidate workflow result

on:
  push:
    branches:
      - fix/s8-cross-step-bound-city
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: s8-monitor-latest
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/s8-cross-step-bound-city

      - name: Wait for latest v2 candidate run and record result
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: fix/s8-cross-step-bound-city
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/audit
          current_run='${{ github.run_id }}'
          target=''
          for _ in $(seq 1 240); do
            target="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/$REPO/actions/workflows/s8-verify-and-package-v2.yml/runs?branch=$(python -c 'import urllib.parse; print(urllib.parse.quote("'"$BRANCH"'", safe=""))')&per_page=10" \
              --jq '.workflow_runs | map(select((.id|tostring) != "'"$current_run"'")) | sort_by(.created_at) | reverse | .[0].id // empty')"
            if [[ -n "$target" ]]; then
              status="$(gh api "/repos/$REPO/actions/runs/$target" --jq '.status')"
              if [[ "$status" == 'completed' ]]; then
                break
              fi
            fi
            sleep 15
          done
          if [[ -z "$target" ]]; then
            echo 'No candidate workflow run found' >&2
            exit 1
          fi
          status="$(gh api "/repos/$REPO/actions/runs/$target" --jq '.status')"
          if [[ "$status" != 'completed' ]]; then
            echo "Candidate workflow did not finish in monitor window: $target status=$status" >&2
            exit 1
          fi
          gh api "/repos/$REPO/actions/runs/$target" > .github/audit/s8-latest-run.json
          conclusion="$(jq -r '.conclusion' .github/audit/s8-latest-run.json)"
          if [[ "$conclusion" != 'success' ]]; then
            gh run view "$target" --repo "$REPO" --log-failed > .github/audit/s8-latest-failure.log 2>&1 || true
          else
            rm -f .github/audit/s8-latest-failure.log
          fi
          printf 'run_id=%s\nstatus=%s\nconclusion=%s\n' "$target" "$status" "$conclusion" \
            > .github/audit/s8-latest-result.txt

      - name: Commit workflow evidence to repair branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/audit/s8-latest-run.json \
            .github/audit/s8-latest-result.txt \
            .github/audit/s8-latest-failure.log || true
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record latest S8 candidate workflow result [skip ci]'
            git push origin HEAD:fix/s8-cross-step-bound-city
          fi
