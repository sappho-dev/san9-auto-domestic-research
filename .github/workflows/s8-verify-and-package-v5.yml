name: Verify and package S8 cross-step city fix v5

on:
  push:
    branches:
      - fix/s8-cross-step-bound-city
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s8-final-candidate-v5
  cancel-in-progress: false

jobs:
  verify-package:
    runs-on: windows-2025
    timeout-minutes: 80
    steps:
      - name: Checkout repair branch with complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/s8-cross-step-bound-city

      - name: Enforce LF checkout
        shell: pwsh
        run: |
          git config core.autocrlf false
          git config core.safecrlf false
          git config core.eol lf
          git reset --hard HEAD

      - name: Install pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.0'
          architecture: x64

      - name: Install pinned Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install exact binary-audit dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check `
            pefile==2024.8.26 capstone==5.0.7
          foreach ($tool in @('python.exe', 'zig.exe', 'dotnet.exe')) {
            $path = (Get-Command $tool -ErrorAction Stop).Source
            Write-Host "$tool=$path sha256=$((Get-FileHash -Algorithm SHA256 $path).Hash)"
          }

      - name: Harden final pipeline and clean obsolete jobs
        shell: pwsh
        run: |
          python .github/scripts/ensure_s8_pipeline_strict.py
          @'
          from pathlib import Path

          path = Path('.github/scripts/run_s8_candidate_pipeline.ps1')
          text = path.read_text(encoding='utf-8')
          anchors = (
              '    .github/workflows/s8-verify-and-package-v2.yml `\n',
              '    .github/workflows/s8-verify-and-package-v3.yml `\n',
          )
          additions = (
              '    .github/workflows/s8-verify-and-package-v4.yml `\n'
              '    .github/workflows/s8-source-diagnostic.yml `\n'
              '    .github/workflows/s8-monitor-latest.yml `\n'
              '    .github/workflows/s8-monitor-v3.yml `\n'
              '    .github/workflows/s8-monitor-v4.yml `\n'
          )
          if '.github/workflows/s8-verify-and-package-v4.yml' not in text:
              for anchor in anchors:
                  if anchor in text:
                      text = text.replace(anchor, anchor + additions, 1)
                      break
              else:
                  raise SystemExit('Could not find S8 cleanup insertion anchor')
          path.write_text(text, encoding='utf-8', newline='\n')
          '@ | python -

      - name: Run complete repair, test, build, and package pipeline
        id: pipeline
        shell: pwsh
        run: |
          .\.github\scripts\run_s8_candidate_pipeline.ps1 `
            -OutputFile $env:GITHUB_OUTPUT

      - name: Upload candidate package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: San9-S8-cross-step-candidate-${{ steps.pipeline.outputs.final_commit }}
          path: ${{ steps.pipeline.outputs.candidate_zip }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Tag the exact uploaded candidate commit
        if: success()
        shell: pwsh
        env:
          FINAL_COMMIT: ${{ steps.pipeline.outputs.final_commit }}
          CANDIDATE_SHA: ${{ steps.pipeline.outputs.candidate_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git fetch origin $env:FINAL_COMMIT
          git cat-file -e "$env:FINAL_COMMIT^{commit}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f -a s8-candidate-latest $env:FINAL_COMMIT `
            -m "S8 candidate sha256=$env:CANDIDATE_SHA; manual gate=巡察→商业"
          git push --force origin refs/tags/s8-candidate-latest
          @"
          ## S8 candidate verified and uploaded

          - Branch: `fix/s8-cross-step-bound-city`
          - Candidate commit: `$env:FINAL_COMMIT`
          - Baseline: `1549d62`
          - Candidate SHA-256: `$env:CANDIDATE_SHA`
          - Native build and offline suite: passed
          - Product build and regression suite: passed
          - Bound reader A/B × Controller/Bridge matrix: passed
          - Next manual gate: 巡察→商业
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: San9-S8-failure-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/*.log
            .github/audit/**
            .github/patches/**
            .github/scripts/apply_s8_fix.recovery.txt
          if-no-files-found: warn
          retention-days: 7
