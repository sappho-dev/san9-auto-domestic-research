name: Verify and package S8 cross-step city fix v2

on:
  push:
    branches:
      - fix/s8-cross-step-bound-city
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s8-verify-and-package-v2
  cancel-in-progress: false

jobs:
  verify-package:
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - name: Checkout repair branch with complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/s8-cross-step-bound-city

      - name: Enforce branch boundary and LF worktree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git branch --show-current) -ne 'fix/s8-cross-step-bound-city') {
            throw 'Unexpected checkout branch'
          }
          git config core.autocrlf false
          git config core.safecrlf false
          git config core.eol lf
          git reset --hard HEAD
          if ((git rev-parse HEAD) -eq (git rev-parse origin/main)) {
            throw 'Repair workflow refuses to operate at origin/main'
          }

      - name: Install pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.0'
          architecture: x64

      - name: Install pinned Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install exact binary-audit dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check `
            pefile==2024.8.26 capstone==5.0.7
          foreach ($tool in @('python.exe', 'zig.exe', 'dotnet.exe')) {
            $path = (Get-Command $tool -ErrorAction Stop).Source
            Write-Host "$tool=$path sha256=$((Get-FileHash -Algorithm SHA256 $path).Hash)"
          }

      - name: Apply or verify final plaintext function patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/scripts/apply_s8_function_patch.py
          python -m py_compile `
            .github/scripts/apply_s8_fix.baseline_1549d62.py `
            .github/scripts/materialize_s8_function_patch_v3.py `
            .github/scripts/apply_s8_function_patch.py `
            .github/scripts/materialize_s8_postbuild_patch.py `
            .github/scripts/apply_s8_postbuild_patch.py `
            tests/verify_s8_bound_path_matrix_v2.py
          git diff --check
          git apply --check --reverse --recount --whitespace=nowarn `
            .github/patches/s8-cross-step-bound-city.function-context.patch

      - name: Verify bound reader A/B times Controller/Bridge matrix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tests/verify_s8_bound_path_matrix_v2.py `
            --report .github/audit/s8-bound-reader-consumer-matrix.json
          git diff --check

      - name: Checkpoint source and tests on repair branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add -- `
            .github/scripts/apply_s8_fix.baseline_1549d62.py `
            .github/scripts/apply_s8_fix.recovery.txt `
            .github/patches/s8-cross-step-bound-city.function-context.patch `
            .github/audit/s8-bound-reader-consumer-matrix.json
          git diff --cached --check
          if (-not (git diff --cached --quiet)) {
            git commit -m 'test: checkpoint S8 source and path matrix [skip ci]'
            git push origin HEAD:fix/s8-cross-step-bound-city
          }

      - name: Bootstrap deterministic native outputs when necessary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:NATIVE_OUT = Join-Path $env:RUNNER_TEMP 'san9-native'
          $env:NATIVE_BOOTSTRAP_LOG = Join-Path $env:RUNNER_TEMP 'native-bootstrap.log'
          Remove-Item -Recurse -Force $env:NATIVE_OUT -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $env:NATIVE_OUT | Out-Null
          $failed = $false
          $caught = $null
          try {
            & .\native\San9BridgeP1EasyPingM2b\build.ps1 `
              -ArtifactRoot $env:NATIVE_OUT *>&1 |
              Tee-Object -FilePath $env:NATIVE_BOOTSTRAP_LOG
            if (-not $?) { throw 'Native bootstrap returned failure' }
          }
          catch {
            $failed = $true
            $caught = $_
            $_ | Out-String | Tee-Object -FilePath $env:NATIVE_BOOTSTRAP_LOG -Append
          }

          $required = @(
            'offline.exe', 'controller.exe', 'bridge.dll', 'bridge_apply_once.dll',
            'bridge_s6_cultivate_apply_once.dll', 'bridge_s6_patrol_apply_once.dll',
            'bridge_s6_train_apply_once.dll', 'bridge_s6_repair_apply_once.dll',
            'bridge_s8_basic_batch.dll', 'bridge_s8_wealthy_batch.dll'
          )
          $missing = @($required | Where-Object {
            -not (Test-Path -LiteralPath (Join-Path $env:NATIVE_OUT $_) -PathType Leaf)
          })
          if ($missing.Count -ne 0) {
            throw "Native bootstrap artifacts missing: $($missing -join ', ')"
          }

          if ($failed) {
            $log = [IO.File]::ReadAllText($env:NATIVE_BOOTSTRAP_LOG)
            if ($log -notmatch 'deterministic whole image rejected') {
              throw $caught
            }
            python .github/scripts/apply_s8_postbuild_patch.py outputs `
              --artifact-root $env:NATIVE_OUT
            git diff --check
          }
          else {
            Write-Host 'Deterministic output hashes were already current.'
          }

      - name: Run final native build and all offline tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:NATIVE_OUT = Join-Path $env:RUNNER_TEMP 'san9-native'
          $env:NATIVE_FINAL_LOG = Join-Path $env:RUNNER_TEMP 'native-final.log'
          Remove-Item -Recurse -Force $env:NATIVE_OUT -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $env:NATIVE_OUT | Out-Null
          & .\native\San9BridgeP1EasyPingM2b\build.ps1 `
            -ArtifactRoot $env:NATIVE_OUT *>&1 |
            Tee-Object -FilePath $env:NATIVE_FINAL_LOG
          if (-not $?) { throw 'Final native build/offline test suite failed' }

          $required = @(
            'offline.exe', 'controller.exe', 'bridge.dll', 'bridge_apply_once.dll',
            'bridge_s6_cultivate_apply_once.dll', 'bridge_s6_patrol_apply_once.dll',
            'bridge_s6_train_apply_once.dll', 'bridge_s6_repair_apply_once.dll',
            'bridge_s8_basic_batch.dll', 'bridge_s8_wealthy_batch.dll'
          )
          foreach ($name in $required) {
            $path = Join-Path $env:NATIVE_OUT $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Final native artifact missing: $name"
            }
            Write-Host "$name sha256=$((Get-FileHash -Algorithm SHA256 $path).Hash)"
          }

      - name: Run complete product build and regression suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:ROOT_BUILD_LOG = Join-Path $env:RUNNER_TEMP 'root-build.log'
          & .\build.ps1 *>&1 | Tee-Object -FilePath $env:ROOT_BUILD_LOG
          if (-not $?) { throw 'Product build/regression suite failed' }

      - name: Materialize audited state evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/scripts/apply_s8_postbuild_patch.py state `
            --artifact-root (Join-Path $env:RUNNER_TEMP 'san9-native') `
            --native-log (Join-Path $env:RUNNER_TEMP 'native-final.log') `
            --root-log (Join-Path $env:RUNNER_TEMP 'root-build.log')
          git diff --check

      - name: Remove obsolete payload and repair workflows
        shell: pwsh
        run: |
          git rm -f --ignore-unmatch -- `
            .github/scripts/apply_s8_fix.py.gz.b64 `
            .github/scripts/apply_s8_fix.decoded.py `
            .github/scripts/decode_s8_patcher.py `
            .github/scripts/materialize_s8_function_patch.py `
            .github/workflows/decode-s8-patcher.yml `
            .github/workflows/recover-s8-plaintext.yml `
            .github/workflows/apply-s8-fix.yml `
            .github/workflows/materialize-s8-source.yml `
            .github/workflows/materialize-s8-source-v2.yml `
            .github/workflows/materialize-s8-source-v3.yml `
            .github/workflows/materialize-s8-source-v4.yml `
            .github/workflows/s8-verify-and-package.yml `
            tests/verify_s8_bound_path_matrix.py

      - name: Commit final verified source state before packaging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          foreach ($path in @(
            '.github/patches/s8-deterministic-output-hashes.patch',
            '.github/patches/s8-state-evidence.patch',
            '.github/audit/s8-bound-reader-consumer-matrix.json'
          )) {
            if (Test-Path -LiteralPath $path -PathType Leaf) { git add -- $path }
          }
          git diff --cached --check
          if (-not (git diff --cached --quiet)) {
            git commit -m 'build: finalize verified S8 cross-step candidate state [skip ci]'
            git push origin HEAD:fix/s8-cross-step-bound-city
          }
          $final = (git rev-parse HEAD).Trim()
          "FINAL_COMMIT=$final" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Assemble candidate from final commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Join-Path $env:RUNNER_TEMP 'San9-S8-cross-step-candidate'
          $native = Join-Path $candidate 'native'
          $product = Join-Path $candidate 'product'
          $evidence = Join-Path $candidate 'evidence'
          New-Item -ItemType Directory -Force -Path $native, $product, $evidence | Out-Null

          Copy-Item -Path (Join-Path $env:RUNNER_TEMP 'san9-native\*') -Destination $native -Recurse -Force
          Get-ChildItem -Path . -Directory -Recurse -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match '[\\/]bin[\\/]Release(?:[\\/]|$)' -and
              $_.FullName -notmatch '[\\/]obj[\\/]'
            } | ForEach-Object {
              $relative = [IO.Path]::GetRelativePath((Get-Location).Path, $_.FullName)
              $target = Join-Path $product $relative
              New-Item -ItemType Directory -Force -Path $target | Out-Null
              Copy-Item -Path (Join-Path $_.FullName '*') -Destination $target -Recurse -Force
            }
          foreach ($name in @('artifacts', 'dist', 'publish', 'out', 'release')) {
            if (Test-Path -LiteralPath $name -PathType Container) {
              Copy-Item -Path $name -Destination (Join-Path $product $name) -Recurse -Force
            }
          }

          foreach ($path in @(
            'STATE.md',
            '.github\audit\s8-bound-reader-consumer-matrix.json',
            '.github\scripts\apply_s8_fix.recovery.txt',
            '.github\patches\s8-cross-step-bound-city.function-context.patch',
            '.github\patches\s8-deterministic-output-hashes.patch',
            '.github\patches\s8-state-evidence.patch'
          )) {
            if (Test-Path -LiteralPath $path -PathType Leaf) {
              Copy-Item $path $evidence -Force
            }
          }
          Copy-Item (Join-Path $env:RUNNER_TEMP 'native-final.log') $evidence -Force
          Copy-Item (Join-Path $env:RUNNER_TEMP 'root-build.log') $evidence -Force

          $files = @()
          Get-ChildItem -Path $candidate -File -Recurse | Sort-Object FullName | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath($candidate, $_.FullName).Replace('\\', '/')
            $files += [ordered]@{
              path = $relative
              size = $_.Length
              sha256 = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            }
          }
          [ordered]@{
            branch = 'fix/s8-cross-step-bound-city'
            commit = '${{ env.FINAL_COMMIT }}'
            baseline = '1549d62'
            native_offline = 'passed'
            product_build = 'passed'
            path_matrix = 'reader A/B x Controller/Bridge passed'
            next_manual_gate = '巡察→商业'
            files = $files
          } | ConvertTo-Json -Depth 7 |
            Set-Content -LiteralPath (Join-Path $candidate 'candidate-manifest.json') `
              -Encoding utf8NoBOM

          $zip = Join-Path $env:RUNNER_TEMP 'San9-S8-cross-step-candidate.zip'
          Remove-Item -Force $zip -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $candidate '*') -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "CANDIDATE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CANDIDATE_SHA=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload candidate package
        uses: actions/upload-artifact@v4
        with:
          name: San9-S8-cross-step-candidate-${{ env.FINAL_COMMIT }}
          path: ${{ env.CANDIDATE_ZIP }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Mark uploaded candidate atomically
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f -a s8-candidate-latest $env:FINAL_COMMIT `
            -m "S8 candidate sha256=$env:CANDIDATE_SHA; manual gate=巡察→商业"
          git push --force origin refs/tags/s8-candidate-latest
          @"
          ## S8 candidate verified and uploaded

          - Branch: `fix/s8-cross-step-bound-city`
          - Commit: `$env:FINAL_COMMIT`
          - Baseline: `1549d62`
          - Candidate SHA-256: `$env:CANDIDATE_SHA`
          - Native build and offline suite: passed
          - Product build and regression suite: passed
          - Bound reader A/B × Controller/Bridge: passed
          - Next manual gate: 巡察→商业
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
