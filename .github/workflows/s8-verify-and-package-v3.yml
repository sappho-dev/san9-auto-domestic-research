name: Verify and package S8 cross-step city fix v3

on:
  push:
    branches:
      - fix/s8-cross-step-bound-city
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s8-final-candidate
  cancel-in-progress: false

jobs:
  verify-package:
    runs-on: windows-2025
    timeout-minutes: 80
    steps:
      - name: Checkout repair branch with complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/s8-cross-step-bound-city

      - name: Enforce LF checkout
        shell: pwsh
        run: |
          git config core.autocrlf false
          git config core.safecrlf false
          git config core.eol lf
          git reset --hard HEAD

      - name: Install pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.0'
          architecture: x64

      - name: Install pinned Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install exact binary-audit dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check `
            pefile==2024.8.26 capstone==5.0.7
          foreach ($tool in @('python.exe', 'zig.exe', 'dotnet.exe')) {
            $path = (Get-Command $tool -ErrorAction Stop).Source
            Write-Host "$tool=$path sha256=$((Get-FileHash -Algorithm SHA256 $path).Hash)"
          }

      - name: Run complete repair, test, build, and package pipeline
        id: pipeline
        shell: pwsh
        run: |
          .\.github\scripts\run_s8_candidate_pipeline.ps1 `
            -OutputFile $env:GITHUB_OUTPUT

      - name: Upload candidate package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: San9-S8-cross-step-candidate-${{ steps.pipeline.outputs.final_commit }}
          path: ${{ steps.pipeline.outputs.candidate_zip }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Mark uploaded candidate atomically
        if: success()
        shell: pwsh
        env:
          FINAL_COMMIT: ${{ steps.pipeline.outputs.final_commit }}
          CANDIDATE_SHA: ${{ steps.pipeline.outputs.candidate_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin fix/s8-cross-step-bound-city
          git checkout -B fix/s8-cross-step-bound-city origin/fix/s8-cross-step-bound-city
          if ((git rev-parse HEAD).Trim() -ne $env:FINAL_COMMIT) {
            throw "Candidate commit drifted before tagging: expected=$env:FINAL_COMMIT actual=$((git rev-parse HEAD).Trim())"
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f -a s8-candidate-latest $env:FINAL_COMMIT `
            -m "S8 candidate sha256=$env:CANDIDATE_SHA; manual gate=巡察→商业"
          git push --force origin refs/tags/s8-candidate-latest
          @"
          ## S8 candidate verified and uploaded

          - Branch: `fix/s8-cross-step-bound-city`
          - Commit: `$env:FINAL_COMMIT`
          - Baseline: `1549d62`
          - Candidate SHA-256: `$env:CANDIDATE_SHA`
          - Native build and offline suite: passed
          - Product build and regression suite: passed
          - Bound reader A/B × Controller/Bridge matrix: passed
          - Next manual gate: 巡察→商业
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: San9-S8-failure-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/*.log
            .github/audit/**
            .github/patches/**
            .github/scripts/apply_s8_fix.recovery.txt
          if-no-files-found: warn
          retention-days: 7
