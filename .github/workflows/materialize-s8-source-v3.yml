name: Materialize S8 function-context source patch v3

on:
  push:
    branches:
      - fix/s8-cross-step-bound-city
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-s8-source-v3
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout repair branch with full baseline history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/s8-cross-step-bound-city

      - name: Enforce LF worktree before any hash or patch operation
        shell: pwsh
        run: |
          git config core.autocrlf false
          git config core.safecrlf false
          git config core.eol lf
          git reset --hard HEAD

      - name: Install pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.0'
          architecture: x64

      - name: Recover 1549d62 baseline and apply function-context patch
        shell: pwsh
        run: |
          python .github/scripts/materialize_s8_function_patch_v3.py
          git diff --check

      - name: Remove abandoned damaged-payload path and obsolete jobs
        shell: pwsh
        run: |
          git rm -f --ignore-unmatch -- `
            .github/scripts/apply_s8_fix.py.gz.b64 `
            .github/scripts/apply_s8_fix.decoded.py `
            .github/scripts/decode_s8_patcher.py `
            .github/scripts/materialize_s8_function_patch.py `
            .github/workflows/decode-s8-patcher.yml `
            .github/workflows/recover-s8-plaintext.yml `
            .github/workflows/apply-s8-fix.yml `
            .github/workflows/materialize-s8-source.yml `
            .github/workflows/materialize-s8-source-v2.yml

      - name: Verify plaintext, function-context coverage, and idempotency
        shell: pwsh
        run: |
          python -m py_compile `
            .github/scripts/apply_s8_fix.baseline_1549d62.py `
            .github/scripts/materialize_s8_function_patch_v3.py
          python .github/scripts/materialize_s8_function_patch_v3.py
          git diff --check
          git apply --check --reverse --recount --whitespace=nowarn `
            .github/patches/s8-cross-step-bound-city.function-context.patch
          $patchText = [IO.File]::ReadAllText(
            '.github/patches/s8-cross-step-bound-city.function-context.patch',
            [Text.Encoding]::UTF8)
          if ($patchText.Contains("`r`n")) {
            throw 'Function-context patch unexpectedly contains CRLF'
          }
          $hunks = ([regex]::Matches($patchText, '(?m)^@@')).Count
          if ($hunks -lt 4) {
            throw "Function-context patch has too few audited hunks: $hunks"
          }

      - name: Commit materialized source state
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if (-not (git diff --cached --quiet)) {
            git commit -m 'fix: materialize S8 cross-step city binding source patch'
            git push origin HEAD:fix/s8-cross-step-bound-city
          }
